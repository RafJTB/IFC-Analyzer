<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <!-- Sécurité : aucun script intégré, aucune ressource extérieure, aucun envoi : le fichier IFC reste sur le PC -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IFC Analyzer by RJB</title>
  <meta name="description" content="Métré d'une maquette IFC (murs, menuiseries, sols, structure…) 100 % dans le navigateur. Le fichier ne quitte jamais ton PC." />
  <meta name="theme-color" content="#11153a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="app-version" content="0.5.0" />
  <link rel="stylesheet" href="styles.css?v=0.5.0" />
  <script src="js/boot.js?v=0.5.0"></script>
  <script type="module" src="js/app.js?v=0.5.0"></script>
</head>
<body>
  <div class="bg-photo" aria-hidden="true"></div>
  <!-- Verre liquide : légère déformation de ce qu'il y a derrière les onglets sélectionnés -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.011 0.02" numOctaves="2" seed="4" result="n"/><feGaussianBlur in="n" stdDeviation="1.5" result="nb"/><feDisplacementMap in="SourceGraphic" in2="nb" scale="14" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
  <a class="skip" href="#vue">Aller au contenu</a>

  <div class="app">
    <!-- ================= BARRE LATÉRALE (mêmes dimensions que Transcripteur IA) ================= -->
    <aside class="sidebar" aria-label="Navigation">
      <div class="side-brand">
        <span class="side-logo"><svg viewBox="0 0 40 40" aria-hidden="true"><path fill="#fff" d="M20 3 35.5 11.5 20 20 4.5 11.5z"/><path fill="#fff" fill-opacity=".74" d="M4.5 13.6 19 21.6V37L4.5 29z"/><path fill="#fff" fill-opacity=".5" d="M35.5 13.6 21 21.6V37l14.5-8z"/></svg></span>
        <div class="side-name"><h1>IFC Analyzer</h1><span class="ver">v0.5</span></div>
      </div>
      <nav class="nav" id="nav" aria-label="Pages"></nav>
      <div class="side-fill"></div>
      <div class="user-wrap"><button type="button" class="user" id="carte-modele"></button></div>
    </aside>

    <!-- ================= ZONE PRINCIPALE ================= -->
    <main class="main">
      <header class="topbar">
        <button type="button" class="top-search" id="btn-recherche" aria-keyshortcuts="Control+K">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Rechercher un type, une page, une action…</span><kbd class="search-kbd" aria-hidden="true">Ctrl K</kbd>
        </button>
        <div class="top-actions">
          <div class="files" id="fichiers" role="group" aria-label="Fichiers ouverts"></div>
          <span class="local-pill" title="Le fichier IFC est analysé sur cet appareil : il n’est envoyé à aucun serveur."><i></i>Analyse locale<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg></span>
          <button type="button" class="icon-btn theme-btn" id="btn-theme" aria-label="Basculer entre mode clair et mode sombre" title="Mode clair / sombre"><svg class="i i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
        </div>
      </header>
      <div class="view" id="vue" tabindex="-1"></div>
    </main>
  </div>

  <input type="file" id="choix-fichier" accept=".ifc,.IFC" multiple hidden />
  <input type="file" id="choix-fond" accept="image/*" hidden />
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <dialog class="palette" id="palette" aria-label="Recherche">
    <div class="pal-in">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="pal-saisie" type="text" placeholder="Rechercher un type, une page, une action…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="pal-liste" aria-label="Rechercher" />
    </div>
    <ul class="pal-list" id="pal-liste" role="listbox" aria-label="Résultats"></ul>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd>naviguer</span><span><kbd>Entrée</kbd>ouvrir</span><span><kbd>Échap</kbd>fermer</span></div>
  </dialog>

  <div class="drop-overlay" id="depot" hidden>
    <div><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></svg>Dépose ton fichier IFC</div>
  </div>
</body>
</html>
